[workspace]
members = [
	"osaca_admin",
	"osaca_app_proxy",
	"osaca_common",
	"osaca_media_proxy",
	"osaca_svc",
	"osaca_messages",
	"osaca_push",
	"osaca_snowflakes",
	"tools/ci",
	"tools/dev",
	"osaca_users",
	"packages/markdown_parser/rust",
	"packages/osaca_crypto/rust",
]
exclude = [
	"packages/markdown_parser/rust/fuzz",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
