{{- include "osaca.validate" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: osaca-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osaca.labels" (dict "root" . "name" "osaca-env" "component" "config") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $k, $val := omit (include "osaca.secretData" . | fromJson) "OSACA_ACTIVITYPUB_SIGNING_KEY_BASE64" }}
  {{ $k }}: {{ $val | b64enc | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: osaca-unfurl-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "osaca.labels" (dict "root" . "name" "osaca-unfurl-env" "component" "config") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- with get (include "osaca.secretData" . | fromJson) "OSACA_ACTIVITYPUB_SIGNING_KEY_BASE64" }}
data:
  OSACA_ACTIVITYPUB_SIGNING_KEY_BASE64: {{ . | b64enc | quote }}
{{- end }}
{{- end }}
