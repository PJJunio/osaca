[package]
name = "osaca-messages"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
osaca_common = { path = "../osaca_common" }
anyhow = "1.0.104"
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
osaca-svc = { path = "../osaca_svc" }
osaca_markdown_parser = { path = "../packages/markdown_parser/rust" }
futures = "0.3.34"
linkify = "0.11.0"
mime_guess = "2.0.5"
rmp-serde = "1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
osaca-svc = { path = "../osaca_svc", features = ["mock"] }

