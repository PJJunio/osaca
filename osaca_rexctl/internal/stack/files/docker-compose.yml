  seaweedfs:
    <<: *osaca-service
    image: ${OSACA_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.47}
    deploy:
      resources:
        limits:
          memory: ${OSACA_SEAWEEDFS_MEMORY_LIMIT:-2gb}
    environment:
      GOMEMLIMIT: ${OSACA_SEAWEEDFS_GOMEMLIMIT:-1536MiB}
      WEED_MASTER_VOLUME_GROWTH_COPY_1: ${OSACA_SEAWEEDFS_VOLUME_GROWTH:-1}
    command: ["server", "-s3", "-s3.iam=false", "-dir=/data", "-master.telemetry=${OSACA_SEAWEEDFS_TELEMETRY:-false}", "-master.volumeSizeLimitMB=${OSACA_SEAWEEDFS_VOLUME_SIZE_LIMIT_MB:-1024}", "-master.garbageThreshold=${OSACA_SEAWEEDFS_GARBAGE_THRESHOLD:-0.1}", "-volume.max=${OSACA_SEAWEEDFS_VOLUME_MAX:-10000}", "-s3.concurrentFileUploadLimit=${OSACA_SEAWEEDFS_S3_CONCURRENT_UPLOADS:-5}"]
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      <<: *osaca-healthcheck
      retries: ${OSACA_SEAWEEDFS_HEALTHCHECK_RETRIES:-20}
      start_period: ${OSACA_SEAWEEDFS_HEALTHCHECK_START_PERIOD:-60s}

  seaweedfs-init:
    image: ${OSACA_SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:4.47}
    deploy:
      resources:
        limits:
          memory: ${OSACA_SEAWEEDFS_INIT_MEMORY_LIMIT:-128mb}
    networks: [osaca]
    logging: *osaca-logging
    depends_on:
      seaweedfs: {condition: service_healthy, restart: true}
    restart: "no"
    environment:
      OSACA_S3_ACCESS_KEY: ${OSACA_S3_ACCESS_KEY:-}
      OSACA_S3_SECRET_KEY: ${OSACA_S3_SECRET_KEY:-}
      OSACA_S3_BUCKET_CDN: ${OSACA_S3_BUCKET_CDN:-osaca}
      OSACA_S3_BUCKET_UPLOADS: ${OSACA_S3_BUCKET_UPLOADS:-osaca-uploads}
      OSACA_S3_BUCKET_REPORTS: ${OSACA_S3_BUCKET_REPORTS:-osaca-reports}
      OSACA_S3_BUCKET_HARVESTS: ${OSACA_S3_BUCKET_HARVESTS:-osaca-harvests}
      OSACA_SEAWEEDFS_INIT_ATTEMPTS: ${OSACA_SEAWEEDFS_INIT_ATTEMPTS:-60}
      OSACA_SEAWEEDFS_UPLOADS_TTL: ${OSACA_SEAWEEDFS_UPLOADS_TTL:-1d}
    entrypoint:
      - /bin/sh
      - -c
      - >
        buckets="$$OSACA_S3_BUCKET_CDN $$OSACA_S3_BUCKET_UPLOADS $$OSACA_S3_BUCKET_REPORTS $$OSACA_S3_BUCKET_HARVESTS";
        missing="$$buckets";
        for attempt in $$(seq 1 $$OSACA_SEAWEEDFS_INIT_ATTEMPTS); do
          if ! nc -z seaweedfs 9333 2>/dev/null; then
            sleep 2;
            continue;
          fi;
          listed=$$(echo "s3.bucket.list" | timeout 10 weed shell -master=seaweedfs:9333 2>&1);
          missing="";
          failure="";
          for b in $$buckets; do
            echo "$$listed" | grep -q "^[[:space:]]*$$b[[:space:]]" || missing="$${missing:+$$missing }$$b";
          done;
          if [ -z "$$missing" ]; then
            if [ "$$OSACA_SEAWEEDFS_UPLOADS_TTL" = off ]; then
              ttl_rule="fs.configure -locationPrefix=/buckets/$$OSACA_S3_BUCKET_UPLOADS/ -delete -apply";
            else
              ttl_rule="fs.configure -locationPrefix=/buckets/$$OSACA_S3_BUCKET_UPLOADS/ -ttl=$$OSACA_SEAWEEDFS_UPLOADS_TTL -apply";
            fi;
            failure="could not configure the S3 identity";
            if echo "s3.configure -user=osaca -access_key=$$OSACA_S3_ACCESS_KEY -secret_key=$$OSACA_S3_SECRET_KEY -actions=Admin,Read,Write,List,Tagging -apply" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1; then
              failure="could not set the expiry of $$OSACA_S3_BUCKET_UPLOADS";
              if echo "$$ttl_rule" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1; then
                echo "buckets ready";
                exit 0;
              fi;
            fi;
            sleep 2;
            continue;
          fi;
          for b in $$missing; do
            echo "s3.bucket.create -name $$b" | timeout 10 weed shell -master=seaweedfs:9333 >/dev/null 2>&1;
          done;
          sleep 2;
        done;
        if [ -n "$$failure" ]; then
          echo "seaweedfs-init $$failure" >&2;
        else
          echo "seaweedfs-init could not verify buckets: $$missing" >&2;
        fi;
        exit 1;

