      OSACA_APP_SIGN_IN_BACKDROP_URL: ${OSACA_APP_SIGN_IN_BACKDROP_URL:-}
      OSACA_APP_THEME_COLOR: ${OSACA_APP_THEME_COLOR:-}
      OSACA_APP_STATUS_PAGE_URL: ${OSACA_APP_STATUS_PAGE_URL:-}
      DISCOVERY_UPSTREAM_URL: http://edge:8088/.well-known/osaca
      DISCOVERY_REFRESH_INTERVAL_MS: ${DISCOVERY_REFRESH_INTERVAL_MS:-5000}
      OSACA_APP_PROXY_INDEX_UPSTREAM_URL: ${OSACA_APP_PROXY_INDEX_UPSTREAM_URL:-}
      OSACA_APP_PROXY_SAME_ORIGIN_HOSTS: ${OSACA_APP_PROXY_SAME_ORIGIN_HOSTS:-}
      OSACA_APPLE_TEAM_ID: ${OSACA_APPLE_TEAM_ID:-}
      OSACA_ANDROID_CERT_FINGERPRINTS: ${OSACA_ANDROID_CERT_FINGERPRINTS:-}
      OSACA_APP_PROXY_MANIFEST_SCOPE_EXTENSIONS: ${OSACA_APP_PROXY_MANIFEST_SCOPE_EXTENSIONS:-}
      OSACA_LIVEKIT_URL: ${OSACA_LIVEKIT_URL:-}
      OSACA_CSP_EXTRA_DEFAULT_SRC: ${OSACA_CSP_EXTRA_DEFAULT_SRC:-}
      OSACA_CSP_EXTRA_CONNECT_SRC: ${OSACA_CSP_EXTRA_CONNECT_SRC:-}
      OSACA_CSP_EXTRA_IMG_SRC: ${OSACA_CSP_EXTRA_IMG_SRC:-}
      OSACA_CSP_EXTRA_MEDIA_SRC: ${OSACA_CSP_EXTRA_MEDIA_SRC:-}
      OSACA_CSP_EXTRA_FONT_SRC: ${OSACA_CSP_EXTRA_FONT_SRC:-}
      OSACA_CSP_EXTRA_SCRIPT_SRC: ${OSACA_CSP_EXTRA_SCRIPT_SRC:-}
      OSACA_CSP_EXTRA_STYLE_SRC: ${OSACA_CSP_EXTRA_STYLE_SRC:-}
      OSACA_CSP_EXTRA_FRAME_SRC: ${OSACA_CSP_EXTRA_FRAME_SRC:-}
      OSACA_CSP_EXTRA_WORKER_SRC: ${OSACA_CSP_EXTRA_WORKER_SRC:-}
      OSACA_CSP_EXTRA_MANIFEST_SRC: ${OSACA_CSP_EXTRA_MANIFEST_SRC:-}
      OSACA_CSP_REPORT_URI: ${OSACA_CSP_REPORT_URI:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/_ready"]
      <<: *osaca-healthcheck
      interval: ${OSACA_APP_PROXY_HEALTHCHECK_INTERVAL:-30s}
    depends_on:
      api: {condition: service_healthy}
      edge: {condition: service_healthy}

  snowflakes:
    <<: *osaca-service
    stop_grace_period: 30s
    image: ${OSACA_REGISTRY:-ghcr.io/${OSACA_REGISTRY_OWNER:-pjjunio}}/osaca-snowflakes:${OSACA_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${OSACA_SNOWFLAKES_MEMORY_LIMIT:-256mb}
    environment:
      <<: *osaca-rust-env
      OSACA_SVC_NAME: snowflakes
      OSACA_SVC_MODE: combined
    healthcheck: *osaca-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}

  users:
    <<: *osaca-service
    stop_grace_period: 30s
    image: ${OSACA_REGISTRY:-ghcr.io/${OSACA_REGISTRY_OWNER:-pjjunio}}/osaca-users:${OSACA_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${OSACA_USERS_MEMORY_LIMIT:-256mb}
    environment:
      <<: *osaca-rust-env
      OSACA_SVC_NAME: users
      OSACA_SVC_MODE: combined
      OSACA_POSTGRES_MAX_CONNECTIONS: "${OSACA_USERS_POSTGRES_MAX_CONNECTIONS:-20}"
    healthcheck: *osaca-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}

  messages:
    <<: *osaca-service
    stop_grace_period: 30s
    image: ${OSACA_REGISTRY:-ghcr.io/${OSACA_REGISTRY_OWNER:-pjjunio}}/osaca-messages:${OSACA_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${OSACA_MESSAGES_MEMORY_LIMIT:-256mb}
    environment:
      <<: *osaca-rust-env
      OSACA_SVC_NAME: messages
      OSACA_SVC_MODE: combined
      OSACA_POSTGRES_MAX_CONNECTIONS: "${OSACA_MESSAGES_POSTGRES_MAX_CONNECTIONS:-20}"
    healthcheck: *osaca-svc-healthcheck
    depends_on:
      nats: {condition: service_healthy}
      postgres: {condition: service_healthy}

  admin:
    <<: *osaca-service
    image: ${OSACA_REGISTRY:-ghcr.io/${OSACA_REGISTRY_OWNER:-pjjunio}}/osaca-admin:${OSACA_IMAGE_TAG:-v1}
    deploy:
      resources:
        limits:
          memory: ${OSACA_ADMIN_MEMORY_LIMIT:-256mb}
    environment:
      <<: *osaca-rust-env
      OSACA_ADMIN_PORT: "8080"
      OSACA_ADMIN_BASE_PATH: ${OSACA_ADMIN_BASE_PATH:-/admin}
      OSACA_API_ENDPOINT: http://api:8080
      OSACA_API_PUBLIC_ENDPOINT: ${OSACA_API_ENDPOINT:-}
      OSACA_STATIC_CDN_ENDPOINT: ${OSACA_STATIC_CDN_ENDPOINT:-${OSACA_PUBLIC_ORIGIN:-${OSACA_PUBLIC_SCHEME:-https}://${OSACA_DOMAIN:-}}}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /_health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]
      <<: *osaca-app-healthcheck
      start_period: ${OSACA_SVC_HEALTHCHECK_START_PERIOD:-60s}
    depends_on:
      api: {condition: service_healthy}

networks:
  osaca:
    driver: bridge

volumes:
  edge-data:
  edge-config:
  postgres-data:
  valkey-data:
  nats-data:
  seaweedfs-data:
  media-proxy-tmp:
