      OSACA_NATS_MAX_FILE_STORE: ${OSACA_NATS_MAX_FILE_STORE:-10GB}
    command:
      - sh
      - -c
      - >
        printf 'http_port: 8222\njetstream {\n  store_dir: /data\n  max_memory_store: %s\n  max_file_store: %s\n}\n'
        "$$OSACA_NATS_MAX_MEMORY_STORE" "$$OSACA_NATS_MAX_FILE_STORE" > /tmp/nats.conf
        && exec nats-server -c /tmp/nats.conf
    volumes:
