x-osaca-rust-env: &osaca-rust-env
  <<: *osaca-env
  TOKIO_WORKER_THREADS: ${OSACA_TOKIO_WORKER_THREADS:-2}
  MALLOC_ARENA_MAX: ${OSACA_MALLOC_ARENA_MAX:-2}

x-osaca-logging: &osaca-logging
  driver: json-file
  options:
    max-size: ${OSACA_LOG_MAX_SIZE:-10m}
    max-file: "${OSACA_LOG_MAX_FILE:-3}"

x-osaca-service: &osaca-service
  restart: ${OSACA_RESTART_POLICY:-unless-stopped}
  networks: [osaca]
  logging: *osaca-logging

x-osaca-healthcheck: &osaca-healthcheck
  interval: ${OSACA_HEALTHCHECK_INTERVAL:-10s}
  timeout: ${OSACA_HEALTHCHECK_TIMEOUT:-5s}
  retries: ${OSACA_HEALTHCHECK_RETRIES:-10}
  start_period: ${OSACA_HEALTHCHECK_START_PERIOD:-60s}
  start_interval: ${OSACA_HEALTHCHECK_START_INTERVAL:-1s}

x-osaca-app-healthcheck: &osaca-app-healthcheck
  interval: ${OSACA_HEALTHCHECK_INTERVAL:-10s}
  timeout: ${OSACA_HEALTHCHECK_TIMEOUT:-5s}
  retries: ${OSACA_APP_HEALTHCHECK_RETRIES:-30}
  start_period: ${OSACA_APP_HEALTHCHECK_START_PERIOD:-90s}
  start_interval: ${OSACA_HEALTHCHECK_START_INTERVAL:-1s}

x-osaca-svc-healthcheck: &osaca-svc-healthcheck
  <<: *osaca-app-healthcheck
  start_period: ${OSACA_SVC_HEALTHCHECK_START_PERIOD:-60s}
  test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8090 && printf \"GET /_health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n 1 <&3 | grep -q \" 200 \"'"]

services:
  edge:
    <<: *osaca-service
    image: ${OSACA_CADDY_IMAGE:-caddy:2.11-alpine}
    deploy:
      resources:
        limits:
          memory: ${OSACA_CADDY_MEMORY_LIMIT:-384mb}
    ports:
      - "${OSACA_HTTP_PORT:-80}:80"
      - "${OSACA_HTTPS_PORT:-443}:443"
      - "${OSACA_HTTPS_PORT:-443}:443/udp"
    environment:
      OSACA_EDGE_SITE_ADDRESS: ${OSACA_EDGE_SITE_ADDRESS:-${OSACA_CADDY_SITE_ADDRESS:-${OSACA_PUBLIC_SCHEME:-https}://${OSACA_DOMAIN:-}}}
      OSACA_EDGE_TRUSTED_PROXIES: ${OSACA_EDGE_TRUSTED_PROXIES:-127.0.0.1/32}
      OSACA_EDGE_ENCODE: ${OSACA_EDGE_ENCODE:-zstd gzip}
      OSACA_EDGE_PROTOCOLS: ${OSACA_EDGE_PROTOCOLS:-h1 h2 h3}
      OSACA_EDGE_GLOBAL_OPTIONS: ${OSACA_EDGE_GLOBAL_OPTIONS:-}
      OSACA_EDGE_TLS_DIRECTIVE: ${OSACA_EDGE_TLS:+tls ${OSACA_EDGE_TLS:-}}
      OSACA_ADMIN_BASE_PATH: ${OSACA_ADMIN_BASE_PATH:-/admin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ./caddy.d:/etc/caddy/conf.d:ro
      - edge-data:/data
      - edge-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      <<: *osaca-healthcheck
    depends_on:
      api: {condition: service_healthy}
      gateway: {condition: service_healthy}

  postgres:
    <<: *osaca-service
    image: ${OSACA_POSTGRES_IMAGE:-postgres:16-alpine}
    deploy:
      resources:
        limits:
          memory: ${OSACA_POSTGRES_MEMORY_LIMIT:-5gb}
        reservations:
          memory: ${OSACA_POSTGRES_MEMORY_RESERVATION:-3gb}
    command: >
      postgres
      -c max_connections=${OSACA_POSTGRES_SERVER_MAX_CONNECTIONS:-150}
      -c shared_buffers=${OSACA_POSTGRES_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${OSACA_POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      -c work_mem=${OSACA_POSTGRES_WORK_MEM:-8MB}
      -c maintenance_work_mem=${OSACA_POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      -c autovacuum_work_mem=${OSACA_POSTGRES_AUTOVACUUM_WORK_MEM:-128MB}
      -c random_page_cost=${OSACA_POSTGRES_RANDOM_PAGE_COST:-1.1}
      -c effective_io_concurrency=${OSACA_POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}
      -c default_statistics_target=${OSACA_POSTGRES_DEFAULT_STATISTICS_TARGET:-200}
      -c jit=${OSACA_POSTGRES_JIT:-off}
      -c min_wal_size=${OSACA_POSTGRES_MIN_WAL_SIZE:-80MB}
      -c max_wal_size=${OSACA_POSTGRES_MAX_WAL_SIZE:-2GB}
      -c checkpoint_completion_target=${OSACA_POSTGRES_CHECKPOINT_COMPLETION_TARGET:-0.9}
      -c wal_buffers=${OSACA_POSTGRES_WAL_BUFFERS:-16MB}
      -c wal_compression=${OSACA_POSTGRES_WAL_COMPRESSION:-zstd}
      -c bgwriter_delay=${OSACA_POSTGRES_BGWRITER_DELAY:-50ms}
      -c bgwriter_lru_maxpages=${OSACA_POSTGRES_BGWRITER_LRU_MAXPAGES:-1000}
      -c autovacuum_vacuum_scale_factor=${OSACA_POSTGRES_AUTOVACUUM_VACUUM_SCALE_FACTOR:-0.05}
      -c autovacuum_analyze_scale_factor=${OSACA_POSTGRES_AUTOVACUUM_ANALYZE_SCALE_FACTOR:-0.02}
      -c autovacuum_vacuum_cost_limit=${OSACA_POSTGRES_AUTOVACUUM_VACUUM_COST_LIMIT:-2000}
      -c autovacuum_max_workers=${OSACA_POSTGRES_AUTOVACUUM_MAX_WORKERS:-3}
      -c max_parallel_workers_per_gather=${OSACA_POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-2}
      -c max_parallel_workers=${OSACA_POSTGRES_MAX_PARALLEL_WORKERS:-8}
      -c track_io_timing=${OSACA_POSTGRES_TRACK_IO_TIMING:-on}
      -c shared_preload_libraries=${OSACA_POSTGRES_SHARED_PRELOAD_LIBRARIES:-pg_stat_statements}
    shm_size: ${OSACA_POSTGRES_SHM_SIZE:-1gb}
    environment:
      POSTGRES_DB: ${OSACA_POSTGRES_DATABASE:-osaca}
      POSTGRES_USER: ${OSACA_POSTGRES_USERNAME:-osaca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      <<: *osaca-healthcheck

  valkey:
    <<: *osaca-service
    image: ${OSACA_VALKEY_IMAGE:-valkey/valkey:9.1-alpine}
    deploy:
      resources:
        limits:
          memory: ${OSACA_VALKEY_MEMORY_LIMIT:-256mb}
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "${OSACA_VALKEY_APPENDFSYNC:-everysec}", "--dir", "/data",
              "--save", "${OSACA_VALKEY_SAVE:-}",
              "--maxmemory", "${OSACA_VALKEY_MAXMEMORY:-192mb}",
              "--maxmemory-policy", "${OSACA_VALKEY_MAXMEMORY_POLICY:-noeviction}"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      <<: *osaca-healthcheck

  nats:
    <<: *osaca-service
    image: ${OSACA_NATS_IMAGE:-nats:2.14-alpine}
    deploy:
      resources:
        limits:
