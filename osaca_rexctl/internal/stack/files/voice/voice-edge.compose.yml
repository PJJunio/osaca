services:
  edge:
    image: ${OSACA_CADDY_IMAGE:-caddy:2.11-alpine}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${OSACA_LOG_MAX_SIZE:-10m}
        max-file: "${OSACA_LOG_MAX_FILE:-3}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OSACA_VOICE_EDGE_GLOBAL_OPTIONS: ${OSACA_VOICE_EDGE_EMAIL:+email ${OSACA_VOICE_EDGE_EMAIL:-}}
      OSACA_VOICE_EDGE_SNI_OPTION: ${OSACA_VOICE_EDGE_IP:+default_sni ${OSACA_VOICE_EDGE_IP:-}}
    volumes:
      - ./Caddyfile.voice:/etc/caddy/Caddyfile:ro
      - ./sites.d:/etc/caddy/sites.d:ro
      - edge-data:/data
      - edge-config:/config
    networks:
      - voice
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

networks:
  voice:
    name: ${OSACA_VOICE_NETWORK:-osaca-voice}
    enable_ipv6: ${OSACA_VOICE_NETWORK_IPV6:-false}

volumes:
  edge-data:
  edge-config:
