[package]
name = "osaca-svc"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
osaca_common = { path = "../osaca_common", version = "0.1.0" }
anyhow = "1.0.104"
async-nats = "0.51"
async-trait = "0.1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
deadpool-postgres = "0.14"
futures = "0.3"
hex = "0.4"
rmp-serde = "1.3"
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }
tokio-postgres-rustls = { version = "0.14", features = ["native-certs", "ring"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

[features]
default = []
mock = []
