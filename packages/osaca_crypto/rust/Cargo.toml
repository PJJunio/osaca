[package]
name = "osaca_crypto"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = { version = "0.9.2", default-features = false }
openmls_rust_crypto = { version = "0.6.0", features = ["test-utils"] }
openmls_traits = { version = "0.6.0" }
openmls_basic_credential = { version = "0.6.0", features = ["clonable"] }
ed25519-dalek = { version = "2.2.0", default-features = false }
aes-gcm = "0.10.3"
hkdf = "0.12.4"
sha2 = "0.10.8"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
tls_codec = { version = "0.5", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "0.9.2", default-features = false, features = ["js"] }
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
rand = "0.8.5"
